[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "my-arithmetic-morgan"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "U.N. Owen", email = "void@some.where" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/U.N. Owen/my-arithmetic-morgan#readme"
Issues = "https://github.com/U.N. Owen/my-arithmetic-morgan/issues"
Source = "https://github.com/U.N. Owen/my-arithmetic-morgan"

[tool.hatch.version]
source = "vcs"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/my_arithmetic_morgan tests}"

[tool.coverage.run]
source_pkgs = ["my_arithmetic_morgan", "tests"]
branch = true
parallel = true
omit = [
  "src/my_arithmetic_morgan/__about__.py",
]

[tool.coverage.paths]
my_arithmetic_morgan = ["src/my_arithmetic_morgan", "*/my-arithmetic-morgan/src/my_arithmetic_morgan"]
tests = ["tests", "*/my-arithmetic-morgan/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.build.hooks.vcs]
version-file = "src/my_arithmetic_morgan/_version.py"

[tool.hatch.envs.docs]
dependencies = [
  "sphinx",
  "furo",
]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -b html docs docs/_build/html"