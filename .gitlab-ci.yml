
variables:
  GIT_DEPTH: 0

stages:
  - test
  - build
  - deploy

before_script:
  - pip install --no-cache-dir hatch

unit-tests:
  stage: test
  script:
    - hatch test --cover
  coverage: '/TOTAL.*\s+(\d+%)$/'

build-package:
  stage: build
  script:
    - hatch build
  artifacts:
    paths:
      - dist/
  rules:
    - if: $CI_COMMIT_TAG

deploy-stable:
  stage: deploy
  script:
    - echo "my-arithmetic-morgan deployment on stable servers"
    - ls -la dist/
  rules:
    - if: $CI_COMMIT_TAG